<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Chatapp</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>

  <!-- Join screen -->
  <main class="join" id="join">
    <form class="join-card" id="join-form" novalidate>
      <svg class="logo" viewBox="0 0 32 32" width="40" height="40" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#3f6b73"/>
        <path d="M9 11.5c0-1.4 1.1-2.5 2.5-2.5h9c1.4 0 2.5 1.1 2.5 2.5v6c0 1.4-1.1 2.5-2.5 2.5H15l-4 3.5V20c-1.1-.3-2-1.2-2-2.5z" fill="#e9efec"/>
      </svg>
      <h1>Join a chat room</h1>
      <p class="lead">Create a room and share its code, or enter a code you were given.</p>

      <label for="name">Display name</label>
      <input id="name" name="name" type="text" maxlength="20" autocomplete="nickname"
             autocapitalize="off" spellcheck="false" aria-describedby="name-hint join-error" required>
      <p class="hint" id="name-hint">2 to 20 characters: letters, numbers, spaces, dots, dashes or underscores.</p>

      <label for="room" class="spaced">Room code</label>
      <input id="room" name="room" type="text" maxlength="8" autocomplete="off"
             autocapitalize="characters" spellcheck="false" placeholder="For example K7M-4PX">
      <p class="error" id="join-error" role="alert"></p>

      <button type="submit" class="primary" id="join-btn">Join room</button>
      <p class="or">or</p>
      <button type="button" class="secondary" id="create-btn">Create a new room</button>
    </form>
  </main>

  <!-- Chat screen -->
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3f6b73"/>
          <path d="M9 11.5c0-1.4 1.1-2.5 2.5-2.5h9c1.4 0 2.5 1.1 2.5 2.5v6c0 1.4-1.1 2.5-2.5 2.5H15l-4 3.5V20c-1.1-.3-2-1.2-2-2.5z" fill="#e9efec"/>
        </svg>
        <span class="brand-name">Chatapp</span>
      </div>
      <div class="top-right">
        <span class="pill room-pill">Room <b id="room-code"></b>
          <button type="button" class="ghost copy" id="copy" aria-label="Copy room code">Copy</button>
        </span>
        <span class="pill" id="online">0 online</span>
        <span class="status" id="status" data-state="connecting" role="status">
          <span class="dot" aria-hidden="true"></span><span id="status-text">Connecting</span>
        </span>
        <button type="button" class="leave" id="leave">Leave chat</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden>
      <span id="banner-text"></span>
      <button type="button" class="ghost" id="banner-close" aria-label="Dismiss announcement">Dismiss</button>
    </div>

    <section class="log-wrap">
      <div class="log" id="log" role="log" aria-live="polite" aria-label="Messages" tabindex="0"></div>
      <button type="button" class="jump" id="jump" hidden>New messages</button>
    </section>

    <div class="typing" id="typing" aria-live="polite"></div>

    <form class="composer" id="composer" novalidate>
      <label for="input" class="sr">Message</label>
      <textarea id="input" rows="1" maxlength="500" placeholder="Write a message" autocomplete="off"></textarea>
      <span class="counter" id="counter" aria-hidden="true"></span>
      <button type="submit" class="primary send" id="send" disabled>Send</button>
    </form>
    <p class="tip">Enter sends. Shift+Enter adds a new line.</p>

    <div class="toast" id="toast" role="status"></div>
  </div>

</body>
</html>
